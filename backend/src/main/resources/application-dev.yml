# ========================================
# 개발 환경 전용 설정
# ========================================

spring:
  # 데이터소스 설정
  datasource:
    # JDBC URL
    # Docker Compose에서는 환경변수로 주입됨
    # 로컬 테스트 시 기본값 사용
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mes_dev}

    # 데이터베이스 사용자
    username: ${SPRING_DATASOURCE_USERNAME:mes_user}

    # 데이터베이스 비밀번호
    password: ${SPRING_DATASOURCE_PASSWORD:mes1234}

    # 드라이버 클래스
    driver-class-name: org.postgresql.Driver

    # HikariCP 설정 (Connection Pool)
    hikari:
      # 커넥션 풀 이름
      pool-name: MES-HikariCP

      # 최대 커넥션 수 (개발 환경은 적게)
      maximum-pool-size: 5

      # 최소 유휴 커넥션 수
      minimum-idle: 2

      # 커넥션 타임아웃 (30초)
      connection-timeout: 30000

      # 유휴 타임아웃 (10분)
      idle-timeout: 600000

  # JPA 개발 환경 설정
  jpa:
    # DDL 자동 생성
    # create: 기존 테이블 삭제 후 재생성
    # create-drop: 종료 시 테이블 삭제
    # update: 변경된 스키마만 반영 (개발 권장)
    # validate: 스키마 검증만
    # none: 아무것도 하지 않음
    hibernate:
      ddl-auto: update

    # SQL 로그 출력 (개발 시 편리)
    show-sql: true

  # DevTools 설정 (자동 재시작)
  devtools:
    restart:
      # 자동 재시작 활성화
      enabled: true

      # 재시작 제외 경로
      exclude: static/**,public/**

    livereload:
      # 라이브 리로드 활성화
      enabled: true

# 로깅 레벨 (개발 환경 - 상세)
logging:
  level:
    # SQL 파라미터 로깅 (TRACE 레벨)
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

    # 데이터베이스 연결 로그
    com.zaxxer.hikari: DEBUG

    # JPA 쿼리 생성 로그
    org.hibernate.SQL: DEBUG
