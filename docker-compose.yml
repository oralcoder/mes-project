# 서비스 정의
services:
  # ========================================
  # PostgreSQL 데이터베이스 서비스 (pgvector 포함)
  # ========================================
  postgres:
    # pgvector가 포함된 PostgreSQL 이미지
    # AI 강의에서 벡터 검색 기능 사용 예정
    image: ankane/pgvector:v0.5.1
    
    # 컨테이너 이름 지정
    container_name: mes-postgres
    
    # 컨테이너 재시작 정책 (항상 재시작)
    restart: always
    
    # 환경변수 설정
    environment:
      # PostgreSQL 슈퍼유저 비밀번호
      POSTGRES_PASSWORD: mes1234
      
      # 생성할 데이터베이스 이름
      POSTGRES_DB: mes_dev
      
      # PostgreSQL 사용자 이름
      POSTGRES_USER: mes_user
      
      # 한국 시간대 설정
      TZ: Asia/Seoul
    
    # 포트 매핑 (호스트:컨테이너)
    ports:
      - "5432:5432"
    
    # 볼륨 마운트 (데이터 영속성)
    volumes:
      # 로컬 디렉토리와 컨테이너 데이터 디렉토리 연결
      # 컨테이너 삭제해도 데이터 유지됨
      - ./postgres-data:/var/lib/postgresql/data
    
    # 헬스체크 설정 (컨테이너 상태 확인)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes_user -d mes_dev"]
      interval: 10s    # 10초마다 체크
      timeout: 5s      # 5초 안에 응답 없으면 실패
      retries: 5       # 5번 실패 시 unhealthy
    
    # 네트워크 설정
    networks:
      - mes-network

  # ========================================
  # Spring Boot API 서버 (개발 모드)
  # ========================================
  backend:
    # OpenJDK 17 기반 이미지
    image: openjdk:17-slim
    
    # 컨테이너 이름 지정
    container_name: mes-backend
    
    # 컨테이너 재시작 정책
    restart: unless-stopped
    
    # 작업 디렉토리 설정
    working_dir: /app
    
    # 볼륨 마운트 (소스 코드 실시간 반영)
    volumes:
      # Spring Boot 소스코드 마운트
      # 코드 수정 시 자동으로 컨테이너에 반영됨
      # .gradle, build 디렉토리도 프로젝트 내에 생성됨
      - ./backend:/app
    
    # 포트 매핑 (호스트:컨테이너)
    ports:
      - "8080:8080"
    
    # 컨테이너 실행 명령어
    # Gradle Wrapper를 사용하여 Spring Boot 실행
    # 패키지 추가 시: docker compose restart backend
    command: bash -c "chmod +x ./gradlew && ./gradlew bootRun --args='--spring.profiles.active=dev'"
    
    # 환경변수 설정
    environment:
      # Spring 프로파일 (개발 환경)
      SPRING_PROFILES_ACTIVE: dev
      
      # PostgreSQL 연결 정보 (컨테이너 이름으로 연결)
      # Docker 내부 네트워크에서는 서비스 이름(postgres)을 호스트명으로 사용
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mes_dev
      SPRING_DATASOURCE_USERNAME: mes_user
      SPRING_DATASOURCE_PASSWORD: mes1234
    
    # 서비스 의존성 설정 (PostgreSQL이 먼저 실행되어야 함)
    depends_on:
      postgres:
        condition: service_healthy  # postgres가 healthy 상태일 때만 시작
    
    # 네트워크 설정
    networks:
      - mes-network
    
    # 헬스체크 설정
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s  # 첫 빌드는 시간이 오래 걸림

  # ========================================
  # React 프론트엔드 서버 (개발 모드)
  # ========================================
  frontend:
    # Node.js 18 기반 이미지
    image: node:20-alpine
    
    # 컨테이너 이름 지정
    container_name: mes-frontend
    
    # 컨테이너 재시작 정책
    restart: unless-stopped
    
    # 작업 디렉토리 설정
    working_dir: /app
    
    # 볼륨 마운트 (소스 코드 실시간 반영)
    volumes:
      # React 소스코드 마운트
      - ./frontend:/app
            
      - node_modules_frontend:/app/node_modules
    
    # 포트 매핑 (호스트:컨테이너)
    ports:
      - "5173:5173"  # Vite 기본 포트
    
    # 컨테이너 실행 명령어
    # npm install 후 개발 서버 실행
    command: sh -c "npm ci || npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    
    # 환경변수 설정
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    
    # 서비스 의존성 설정
    depends_on:
      - backend
    
    # 네트워크 설정
    networks:
      - mes-network


# ========================================
# Docker 볼륨 
# ========================================
volumes:
  node_modules_frontend:


# ========================================
# 네트워크 정의
# ========================================
networks:
  mes-network:
    # 네트워크 이름
    name: mes-network
    
    # 브릿지 네트워크 (기본값)
    driver: bridge